  // ── Tabs ────────────────────────────────────────────────────────────────
  function renderTabs() {
    const tabs = [['historia', 'Resultados do piloto'], ...(UNICA ? [] : [['geral', 'Visão geral']]), ...DATA.empresas.map(e => [e.id, UNICA ? 'Mapa de competências' : e.nome]), ['guia', 'Como ler']];
    $('tabs').innerHTML = tabs.map(([id, nm]) => `<button class="tab" role="tab" aria-selected="${state.tab === id}" data-tab="${id}">${esc(nm)}</button>`).join('');
  }
  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]'); if (!b) return;
    state.tab = b.dataset.tab; state.busca = ''; render(); window.scrollTo({ top: 0 });
  });

  function render() {
    renderTabs();
    $('main').innerHTML = state.tab === 'historia' ? renderHistoria() : state.tab === 'geral' ? renderGeral() : state.tab === 'guia' ? renderGuia() : renderEmpresa(EMP[state.tab]);
    if (EMP[state.tab] && !EMP[state.tab].vazio) initGeo(EMP[state.tab]); else if (geoMap) { geoMap.remove(); geoMap = null; }
  }

  // ── Visão geral ─────────────────────────────────────────────────────────
  function renderGeral() {
    return `
      <section class="block" style="margin-top:0">
        <div class="sec-h"><h2>As duas operações lado a lado</h2>
          <span class="hint">Cada empresa tem sua própria matriz de competências (hotelaria de luxo × venda consultiva). A comparação direta é de volume, nota e evolução; as competências são lidas dentro de cada empresa.</span></div>
        <div class="grid g2">${DATA.empresas.map(coCard).join('')}</div>
      </section>
      ${metodo()}`;
  }

  // ── Radar (SVG puro) ────────────────────────────────────────────────────
  // series: [{ nome, vals: {k: v|null}, cor, tracejado, preench }]
  function radarSVG(e, series, opts = {}) {
    const size = opts.size || 500, pad = opts.pad || 118, R = (size - pad * 2) / 2, cx = size / 2, cy = size / 2;
    // só entram eixos com valor em TODAS as séries (evita desenhar "0%" onde não há evidência)
    const eixos = e.skills.filter(s => series.every(se => se.vals[s.k] != null));
    const fora = e.skills.filter(s => !eixos.includes(s) && series.some(se => se.vals[s.k] != null));
    if (eixos.length < 3) {
      return `<div class="radar-empty muted small">Evidência insuficiente para o radar (é preciso ter pelo menos 3 competências com dados${series.length > 1 ? ' nas duas séries' : ''}).</div>`;
    }
    const n = eixos.length, ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
    const pt = (i, v) => [cx + Math.cos(ang(i)) * R * v / 100, cy + Math.sin(ang(i)) * R * v / 100];
    let g = '';
    [25, 50, 75, 100].forEach(r => {
      const poly = eixos.map((_, i) => pt(i, r).map(x => x.toFixed(1)).join(',')).join(' ');
      g += `<polygon points="${poly}" fill="none" stroke="var(--grid)" stroke-width="${r === 100 ? 1.5 : 1}"/>`;
    });
    eixos.forEach((_, i) => { const [x, y] = pt(i, 100); g += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--grid)"/>`; });
    [50, 100].forEach(r => { g += `<text x="${cx + 4}" y="${(cy - R * r / 100 + 12).toFixed(1)}" class="rd-tick">${r}%</text>`; });
    series.forEach(se => {
      const pts = eixos.map((s, i) => pt(i, se.vals[s.k]));
      g += `<polygon points="${pts.map(p => p.map(x => x.toFixed(1)).join(',')).join(' ')}" fill="${se.preench ? se.cor : 'none'}" fill-opacity="${se.preench ? 0.16 : 0}" stroke="${se.cor}" stroke-width="2" ${se.tracejado ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round"/>`;
      pts.forEach(([x, y], i) => {
        const s = eixos[i];
        g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${opts.small ? 3 : 4}" fill="${se.tracejado ? 'var(--surface)' : se.cor}" stroke="${se.cor}" stroke-width="2"/>`;
        g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="11" fill="transparent" data-tip="${esc(`${se.nome} · ${s.nome}: ${se.vals[s.k]}%`)}"/>`;
      });
    });
    eixos.forEach((s, i) => {
      const a = ang(i), lx = cx + Math.cos(a) * (R + 14), ly = cy + Math.sin(a) * (R + 14);
      const anchor = Math.abs(Math.cos(a)) < 0.2 ? 'middle' : Math.cos(a) > 0 ? 'start' : 'end';
      const words = s.nome.split(' '), lines = []; let cur = '';
      words.forEach(w => { if ((cur + ' ' + w).trim().length > (opts.small ? 13 : 15) && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
      if (cur) lines.push(cur);
      const txt = [s.emoji + ' ' + lines[0], ...lines.slice(1)].slice(0, 3);
      const dy0 = Math.sin(a) > 0.3 ? 4 : Math.sin(a) < -0.3 ? -(txt.length - 1) * 13 - 2 : -(txt.length - 1) * 6.5 + 4;
      const tipTxt = s.nome + ': ' + series.map(se => `${se.nome} ${se.vals[s.k]}%`).join(' · ');
      g += `<text x="${lx.toFixed(1)}" y="${(ly + dy0).toFixed(1)}" text-anchor="${anchor}" class="rd-lbl${opts.small ? ' sm' : ''}" data-tip="${esc(tipTxt)}">${txt.map((l, j) => `<tspan x="${lx.toFixed(1)}" dy="${j ? 13 : 0}">${esc(l)}</tspan>`).join('')}</text>`;
    });
    const legenda = series.length > 1 ? `<div class="rd-leg">${series.map(se => `<span><svg width="26" height="10"><line x1="1" y1="5" x2="25" y2="5" stroke="${se.cor}" stroke-width="2.5" ${se.tracejado ? 'stroke-dasharray="5 4"' : ''}/></svg>${esc(se.nome)}</span>`).join('')}</div>` : '';
    const nota = fora.length && !opts.small ? `<div class="muted small" style="margin-top:6px">Fora do radar por pouca evidência${series.length > 1 ? ' em uma das séries' : ''}: ${fora.map(s => esc(s.nome)).join(', ')}.</div>` : '';
    return `<svg viewBox="0 0 ${size} ${size}" class="radar" role="img" aria-label="Radar de competências">${g}</svg>${legenda}${nota}`;
  }
  const domVals = p => Object.fromEntries(Object.entries(p.dom).map(([k, d]) => [k, d.v]));
  const evoVals = (p, lado) => Object.fromEntries(Object.entries(p.evo || {}).map(([k, v]) => [k, v[lado]]));
  const COR_A = 'var(--accent)', COR_B = 'var(--text-3)';

  function radarEmpresa(e) {
    const opcoes = [['evo', `${e.nome}: início × recente`], ['emp', `${e.nome}: perfil atual`],
      ...e.areas.map(a => ['a:' + a.nome, `Área: ${a.nome} × empresa`]),
      ...e.pessoas.filter(p => p.n >= 2).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')).map(p => ['p:' + p.nome, `Corretor: ${p.nome} × empresa`])];
    if (!opcoes.some(o => o[0] === state.radar)) state.radar = 'evo';
    const v = state.radar;
    let series, texto;
    if (v === 'evo') {
      series = [{ nome: '1ª metade das sessões', vals: evoVals(e.geral, 'ini'), cor: COR_B, tracejado: true },
                { nome: '2ª metade (recente)', vals: evoVals(e.geral, 'rec'), cor: COR_A, preench: true }];
      texto = 'Onde a área azul passa da linha tracejada, a competência evoluiu; onde fica dentro, piorou.';
    } else if (v === 'emp') {
      series = [{ nome: e.nome, vals: domVals(e.geral), cor: COR_A, preench: true }];
      texto = 'Quanto mais perto da borda, mais a competência aparece como ponto forte.';
    } else {
      const alvo = v.startsWith('a:') ? e.areas.find(a => a.nome === v.slice(2)) : e.pessoas.find(p => p.nome === v.slice(2));
      series = [{ nome: 'Empresa toda', vals: domVals(e.geral), cor: COR_B, tracejado: true },
                { nome: alvo.nome, vals: domVals(alvo), cor: COR_A, preench: true }];
      texto = 'Onde a área azul passa da linha tracejada, está acima da média da empresa.';
    }
    return `<div class="radar-ctrl"><select class="input" id="radarSel" aria-label="O que comparar no radar">${opcoes.map(([k, l]) => `<option value="${esc(k)}" ${k === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
      <span class="muted small">${texto}</span></div>
      <div class="radar-box">${radarSVG(e, series)}</div>`;
  }

  function coCard(e) {
    if (e.vazio) return `<div class="card co-card"><div class="co-head"><h2>${esc(e.nome)}</h2></div>
      <div class="empty-state"><b>Dados ainda não carregados.</b><br>
      ${esc(e.motivo || 'Rode o gerador com o arquivo de simulações desta empresa.')}</div></div>`;
    const g = e.geral;
    return `<div class="card co-card">
      <div class="co-head"><h2>${esc(e.nome)}</h2><button class="btn" data-go="${e.id}">Abrir mapa →</button></div>
      <div class="co-kpis">
        <div><div class="v num">${e.sessoes}</div><div class="l">sessões avaliadas</div></div>
        <div><div class="v num">${e.pessoasTotal}</div><div class="l">corretores</div></div>
        <div><div class="v num">${f1(g.score)}</div><div class="l">nota média</div></div>
        <div><div class="v">${deltaBadge(g.deltaPct, '%') || '—'}</div><div class="l">evolução ${f1(g.scoreIni)} → ${f1(g.scoreRec)}</div></div>
      </div>
      <div class="co-radar">${radarSVG(e, [{ nome: 'Início', vals: evoVals(g, 'ini'), cor: COR_B, tracejado: true }, { nome: 'Recente', vals: evoVals(g, 'rec'), cor: COR_A, preench: true }], { small: true, size: 420, pad: 100 })}</div>
      <div><div class="lbl">Linha de ataque</div>
        <ol class="co-list">${g.prios.map((p, i) => `<li><span class="n">${i + 1}</span><span>${esc(skName(e, p.k))} <span class="muted small">· ponto de melhoria em ${p.taxa}% das sessões recentes</span></span></li>`).join('') || '<li class="muted">Sem padrão claro ainda.</li>'}</ol></div>
      <div><div class="lbl">O que evoluiu</div>
        <div class="pills">${g.evoluiu.map(v => `<span class="pill good">${esc(skName(e, v.k))}${v.delta != null ? ` +${v.delta}` : ''}</span>`).join('') || '<span class="muted small">Nenhuma competência com evolução clara ainda.</span>'}</div></div>
      <div><div class="lbl">Domina</div>
        <div class="pills">${g.fortes.map(k => `<span class="pill">${esc(skName(e, k))} · ${g.dom[k].v}%</span>`).join('') || '<span class="muted small">Nenhuma competência com domínio acima de 60%.</span>'}</div></div>
      <div class="muted small">Período: ${esc(e.periodo[0])} a ${esc(e.periodo[1])}</div>
    </div>`;
  }
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]'); if (g) { state.tab = g.dataset.go; render(); window.scrollTo({ top: 0 }); }
  });

  // ── Empresa ─────────────────────────────────────────────────────────────
  function renderEmpresa(e) {
    if (e.vazio) return `<section class="block" style="margin-top:0"><div class="card co-card"><h2>${esc(e.nome)}</h2>
      <div class="empty-state"><b>Dados ainda não carregados.</b><br>${esc(e.motivo || '')}</div></div></section>`;
    const g = e.geral;
    const maxM = Math.max(1, ...e.meses.map(m => m.score || 0));
    const mesNome = m => { const [y, mm] = m.split('-'); return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+mm - 1] + '/' + y.slice(2); };
    return `
      ${filtroBar(e)}
      <section class="block" style="margin-top:14px">
        <div class="grid g4">
          <div class="card pad kpi"><div class="l">Sessões avaliadas</div><div class="v num">${e.sessoes}</div><div class="s">${e.runsTotal ? `de ${e.runsTotal} runs · ` : ''}${esc(e.periodo[0])} a ${esc(e.periodo[1])}</div></div>
          <div class="card pad kpi"><div class="l">Corretores</div><div class="v num">${e.pessoasTotal}</div><div class="s">${e.areas.length} áreas</div></div>
          <div class="card pad kpi"><div class="l">Nota média</div><div class="v num">${f1(g.score)}</div><div class="s">de 0 a 100</div></div>
          <div class="card pad kpi"><div class="l">Evolução da nota</div><div class="v num">${g.deltaPct == null ? '—' : (g.deltaPct > 0 ? '+' : '') + f1(g.deltaPct) + '%'}</div><div class="s">1ª metade ${f1(g.scoreIni)} → 2ª metade ${f1(g.scoreRec)}</div></div>
        </div>
        <div class="card pad mcard" style="margin-top:14px">
          ${mesChart(e)}
        </div>
      </section>

      ${geoSection(e)}

      <section class="block">
        <div class="sec-h"><h2>Linha de ataque: o que trabalhar agora</h2>
          <span class="hint">As competências que mais aparecem como ponto de melhoria nas sessões mais recentes, com o cenário onde treinar e quem precisa.</span></div>
        <div class="grid g3">${g.prios.map((p, i) => prioCard(e, p, i)).join('') || '<div class="card pad muted">Sem pontos de melhoria recorrentes.</div>'}</div>
      </section>

      ${funilSection(e)}

      <section class="block">
        <div class="sec-h"><h2>O que evoluiu até agora</h2>
          <span class="hint">Comparação entre a primeira e a segunda metade das sessões avaliadas, em ordem cronológica.</span></div>
        <div class="grid g2">
          <div class="card pad"><div class="lbl">Competências</div>${evoList(e, g.evoluiu) || '<div class="muted small">Nenhuma competência com evolução clara ainda.</div>'}</div>
          <div class="card pad"><div class="lbl">Corretores que mais subiram a nota</div>${topPessoas(e) || '<div class="muted small">Ainda não há corretores com sessões suficientes para medir evolução.</div>'}</div>
        </div>
      </section>

      <section class="block">
        <div class="sec-h"><h2>Por área</h2></div>
        <div class="grid ${e.areas.length >= 3 ? 'g3' : 'g2'}">${e.areas.map(a => areaCard(e, a)).join('')}</div>
      </section>

      <section class="block">
        <div class="sec-h"><h2>Radar de competências</h2>
          <span class="hint">Cada eixo é uma competência; o valor é o domínio (% das menções como ponto forte). Escolha o que comparar.</span></div>
        <div class="card pad" id="radarWrap">${radarEmpresa(e)}</div>
      </section>

      <section class="block">
        <div class="sec-h"><h2>Mapa de competências</h2>
          <span class="hint">Barra = domínio: % das menções de cada competência que foram ponto forte (e não ponto de melhoria). Em “Evolução”, a barra mostra o domínio recente e o traço marca onde estava na primeira metade das sessões.</span></div>
        <div class="hm-controls">
          <div class="seg" role="group" aria-label="Ver por" ${filtroAtivo() ? 'style="display:none"' : ''}>
            <button aria-pressed="${state.rows === 'areas'}" data-rows="areas">Áreas</button>
            <button aria-pressed="${state.rows === 'pessoas'}" data-rows="pessoas">Corretores</button>
          </div>
          <div class="seg" role="group" aria-label="Métrica">
            <button aria-pressed="${state.metric === 'dom'}" data-metric="dom">Domínio</button>
            <button aria-pressed="${state.metric === 'evo'}" data-metric="evo">Evolução</button>
          </div>
        </div>
        <div class="grid g3" id="hm">${barCards(e)}</div>
        ${legend()}
        ${filtroAtivo() ? `<div class="muted small" style="margin-top:6px">Filtro ativo (${esc(rotuloFiltro())}): cada corretor aparece ao lado da empresa toda${filtrar(e).length > 1 ? ' e do grupo filtrado' : ''}, para comparar. Clique no nome para abrir o plano individual.</div>` : ''}
        ${!filtroAtivo() && state.rows === 'pessoas' && e.pessoas.some(p => p.n < 2) ? `<div class="muted small" style="margin-top:6px">Pessoas com só 1 sessão avaliada não aparecem aqui (${e.pessoas.filter(p => p.n < 2).length}); elas continuam na lista abaixo.</div>` : ''}
      </section>

      ${execSection(e)}

      <section class="block">
        <div class="sec-h"><h2>Corretores</h2><span class="hint">Clique em um corretor para ver o mapa individual e o plano de desenvolvimento dele. Use os filtros do topo para recortar por cidade, equipe, nome ou e-mail.</span></div>
        <div class="people-controls">
          <select class="input" id="ordem" aria-label="Ordenar">
            <option value="n" ${state.ordem === 'n' ? 'selected' : ''}>Mais sessões</option>
            <option value="score" ${state.ordem === 'score' ? 'selected' : ''}>Maior nota</option>
            <option value="evo" ${state.ordem === 'evo' ? 'selected' : ''}>Maior evolução</option>
            <option value="nome" ${state.ordem === 'nome' ? 'selected' : ''}>Nome</option>
          </select>
        </div>
        <div class="grid g3" id="people">${peopleCards(e)}</div>
      </section>
      ${metodo()}`;
  }

  function prioCard(e, p, i) {
    const s = sk(e, p.k);
    const quem = p.pessoas || [];
    return `<div class="card prio">
      <span class="rank num">${i + 1}</span>
      <h3>${esc(s.emoji)} ${esc(s.nome)}</h3>
      <div class="big">Ponto de melhoria em <b class="num">${p.taxa}%</b> das sessões recentes</div>
      <div class="row">
        <span class="pill">Domínio ${p.dom == null ? '—' : p.dom + '%'}</span>
        ${p.tend != null ? `<span>tendência ${deltaBadge(p.tend)}</span>` : ''}
      </div>
      ${p.cenario ? `<div class="small"><span class="muted">Treinar em:</span> <b>${esc(p.cenario)}</b></div>` : ''}
      <div class="acao"><b>Ação:</b> ${esc(p.acao)}</div>
      ${p.exemplos && p.exemplos[0] ? `<div class="quote">“${esc(p.exemplos[0])}”</div>` : ''}
      ${quem.length ? `<div><div class="lbl">Quem priorizar (${quem.length})</div><div class="chips">${quem.slice(0, 10).map(n => `<button class="chip" data-person="${esc(n)}">${esc(n)}</button>`).join('')}${quem.length > 10 ? `<span class="chip">+${quem.length - 10}</span>` : ''}</div></div>` : ''}
    </div>`;
  }

  function evoList(e, list) {
    return (list || []).map(v => `<div class="evo-item"><span>${esc(skName(e, v.k))}</span>
      <span class="evo-bar">${v.tipo === 'dominio'
        ? `<span class="num">${v.ini}% → ${v.rec}%</span> ${deltaBadge(v.delta, '')}`
        : `<span>deixou de aparecer como ponto de melhoria</span> <span class="delta up">✓</span>`}</span></div>`).join('');
  }

  function topPessoas(e) {
    return e.pessoas.filter(p => p.deltaPct != null && p.deltaPct > 0 && p.n >= 3)
      .sort((a, b) => b.deltaPct - a.deltaPct).slice(0, 5)
      .map(p => `<div class="evo-item"><button class="chip" data-person="${esc(p.nome)}" style="font-size:13px">${esc(p.nome)}</button>
        <span class="evo-bar"><span class="num">${f1(p.scoreIni)} → ${f1(p.scoreRec)}</span> ${deltaBadge(p.deltaPct, '%')}</span></div>`).join('');
  }

  function areaCard(e, a) {
    return `<div class="card area">
      <div class="area-h"><h3>${esc(a.nome)}</h3><span class="sc num">${f1(a.score)}</span></div>
      <div class="meta"><span>${a.pessoas} corretores</span><span>${a.n} sessões</span>${a.deltaPct != null ? `<span>${deltaBadge(a.deltaPct, '%')} <span class="muted">(${f1(a.scoreIni)} → ${f1(a.scoreRec)})</span></span>` : ''}</div>
      <div><div class="lbl">Domina</div><div class="pills">${a.fortes.map(k => `<span class="pill good">${esc(skName(e, k))}</span>`).join('') || '<span class="muted small">—</span>'}</div></div>
      <div><div class="lbl">Prioridades</div><div class="pills">${a.prios.map(p => `<span class="pill warn">${esc(skName(e, p.k))} · ${p.taxa}%</span>`).join('') || '<span class="muted small">—</span>'}</div></div>
      ${a.evoluiu.length ? `<div><div class="lbl">Evoluiu</div><div class="pills">${a.evoluiu.slice(0, 3).map(v => `<span class="pill">${esc(skName(e, v.k))}${v.delta != null ? ' +' + v.delta : ''}</span>`).join('')}</div></div>` : ''}
    </div>`;
  }

  function barCards(e) {
    const empresa = { nome: 'Empresa toda', sub: `${e.sessoes} sessões · ${e.pessoasTotal} corretores`, p: e.geral };
    const subP = p => [p.equipe, p.cidade, `${p.n} ${p.n === 1 ? 'sessão' : 'sessões'}`].filter(Boolean).join(' · ');
    if (filtroAtivo()) {
      const lista = filtrar(e);
      if (!lista.length) return '<div class="card pad muted">Nenhum corretor com sessões avaliadas nesse filtro.</div>';
      const cols0 = e.skills.filter(s => e.geral.dom[s.k].s + e.geral.dom[s.k].g > 0).sort((a, b) => (e.geral.dom[b.k].v ?? -1) - (e.geral.dom[a.k].v ?? -1));
      const grupo = lista.length > 1 ? [{ nome: `Grupo: ${rotuloFiltro()}`, sub: `${lista.length} corretores · ${agrega(e, lista).n} sessões`, p: agrega(e, lista) }] : [];
      const ind = [...lista].sort((a, b) => b.n - a.n).map(p => ({ nome: p.nome, sub: subP(p), p, person: true }));
      return [empresa, ...grupo, ...ind].map(r => `<div class="card pad bars-card">
        <div class="bc-h" ${r.person ? `data-person="${esc(r.nome)}" style="cursor:pointer"` : ''}>
          <div><div class="bc-t">${esc(r.nome)}</div><div class="muted small">${esc(r.sub)}</div></div>
          ${r.p.deltaPct != null ? deltaBadge(r.p.deltaPct, '%') : ''}
        </div>
        ${cols0.map(s => barRow(r, s)).join('')}
      </div>`).join('');
    }
    const rows = state.rows === 'areas'
      ? [{ nome: 'Empresa toda', sub: `${e.sessoes} sessões · ${e.pessoasTotal} corretores`, p: e.geral }, ...e.areas.map(a => ({ nome: a.nome, sub: `${a.n} sessões · ${a.pessoas} pessoas`, p: a }))]
      : [...e.pessoas].filter(p => p.n >= 2).sort((a, b) => b.n - a.n).map(p => ({ nome: p.nome, sub: [p.equipe, p.cidade, p.area, `${p.n} sessões`].filter(Boolean).join(' · '), p, person: true }));
    // mesma ordem de competências em todos os cards (pelo domínio da empresa), para comparar lado a lado
    const cols = e.skills.filter(s => e.geral.dom[s.k].s + e.geral.dom[s.k].g > 0)
      .sort((a, b) => (e.geral.dom[b.k].v ?? -1) - (e.geral.dom[a.k].v ?? -1));
    return rows.map(r => `<div class="card pad bars-card">
      <div class="bc-h" ${r.person ? `data-person="${esc(r.nome)}" style="cursor:pointer"` : ''}>
        <div><div class="bc-t">${esc(r.nome)}</div><div class="muted small">${esc(r.sub)}</div></div>
        ${r.p.deltaPct != null ? deltaBadge(r.p.deltaPct, '%') : ''}
      </div>
      ${cols.map(s => barRow(r, s)).join('')}
    </div>`).join('');
  }
  function barRow(r, s) {
    const d = r.p.dom[s.k];
    if (state.metric === 'dom') {
      const c = heatBg(d.v);
      const tip = `${s.nome}: ${d.v == null ? 'pouca evidência' : 'domínio ' + d.v + '%'} (${d.s}× ponto forte, ${d.g}× ponto de melhoria)`;
      return `<div class="sbar ${d.v == null ? 'na' : ''}" data-tip="${esc(tip)}">
        <span>${esc(s.emoji)} ${esc(s.nome)}</span>
        <span class="track">${c ? `<i style="width:${Math.max(d.v, 2)}%;background:${c.bg}"></i>` : ''}</span>
        <span class="val num">${d.v == null ? '—' : d.v + '%'}</span></div>`;
    }
    const ev = (r.p.evo || {})[s.k] || {};
    if (!r.p.evo || !Object.keys(r.p.evo).length) return `<div class="sbar na" data-tip="${esc(s.nome + ': evolução não calculada para grupos filtrados')}"><span>${esc(s.emoji)} ${esc(s.nome)}</span><span class="track"></span><span class="val num">—</span></div>`;
    const has = ev.delta != null;
    const c = has ? evoBg(ev.delta) : null;
    const tip = `${s.nome}: ${has ? `${ev.ini}% → ${ev.rec}%` : 'sem sessões suficientes nas duas metades'}`;
    return `<div class="sbar ${has ? '' : 'na'}" data-tip="${esc(tip)}">
      <span>${esc(s.emoji)} ${esc(s.nome)}</span>
      <span class="track">${has ? `<i style="width:${Math.max(ev.rec, 2)}%;background:${c.bg}"></i><b class="mark" style="left:calc(${ev.ini}% - 1px)"></b>` : ''}</span>
      <span class="val num">${has ? (ev.delta > 0 ? '+' : '') + ev.delta : '—'}</span></div>`;
  }
  function legend() {
    const dom = state.metric === 'dom';
    return `<div class="legend"><span>${dom ? 'Mais ponto de melhoria' : 'Piorou'}</span>
      <span class="scale">${[0, 1, 2, 3, 4, 5, 6].map(i => `<span style="background:var(--h-${i})"></span>`).join('')}</span>
      <span>${dom ? 'Mais ponto forte' : 'Melhorou'}</span>
      ${dom ? '' : '<span style="margin-left:12px;display:inline-flex;align-items:center;gap:6px"><b style="display:inline-block;width:2px;height:14px;background:var(--text)"></b>onde estava no início</span>'}
      <span style="margin-left:12px">— = ${dom ? 'pouca evidência (menos de 2–3 menções)' : 'sem dados suficientes nas duas metades'}</span></div>`;
  }

  function peopleCards(e) {
    const list = filtrar(e);
    const ord = { n: (a, b) => b.n - a.n, score: (a, b) => (b.score || 0) - (a.score || 0), evo: (a, b) => (b.deltaPct ?? -999) - (a.deltaPct ?? -999), nome: (a, b) => a.nome.localeCompare(b.nome, 'pt-BR') }[state.ordem];
    return list.sort(ord).map(p => `<button type="button" class="card person" data-person="${esc(p.nome)}">
      <div class="top"><div><div class="nm">${esc(p.nome)} ${p.segmento === 'Liderança' ? '<span class="badge-lead">Liderança</span>' : ''}</div><div class="sub">${esc([p.equipe, p.cidade].filter(Boolean).join(' · ') || 'Fora da planilha de usuários')}</div><div class="sub">${esc(p.area)} · última sessão ${esc(p.ultima)}</div></div>${spark(p.serie)}</div>
      <div class="stats"><span><b class="num">${f1(p.score)}</b> nota</span><span>${p.n} sessões</span>${deltaBadge(p.deltaPct, '%')}</div>
      <div class="kv"><span>Forte em</span><span>${p.fortes[0] ? esc(skName(e, p.fortes[0])) : '<span class="muted">—</span>'}</span>
        <span>Prioridade</span><span>${p.prios[0] ? esc(skName(e, p.prios[0].k)) : '<span class="muted">—</span>'}</span></div>
    </button>`).join('') || '<div class="muted">Nenhum corretor encontrado com esses filtros.</div>';
  }

  // ── Drawer pessoa ───────────────────────────────────────────────────────
  function openPerson(nome) {
    const e = EMP[state.tab] || DATA.empresas.find(x => !x.vazio); if (!e || e.vazio) return;
    const p = e.pessoas.find(x => x.nome === nome); if (!p) return;
    const skills = e.skills.map(s => ({ s, d: p.dom[s.k], ev: (p.evo || {})[s.k] }))
      .filter(x => x.d.s + x.d.g > 0)
      .sort((a, b) => (b.d.v ?? -1) - (a.d.v ?? -1));
    $('drawer').innerHTML = `
      <div class="dh"><div><h2 id="dTitle">${esc(p.nome)}</h2><div class="muted small">${esc(e.nome)} · ${esc(p.area)} · ${p.n} sessões avaliadas · última em ${esc(p.ultima)}</div>
        <div class="muted small">${p.cidade || p.equipe ? `${esc([p.equipe, p.cidade].filter(Boolean).join(' · '))}${p.email ? ` · <a href="mailto:${esc(p.email)}">${esc(p.email)}</a>` : ''}` : 'Fora da planilha de usuários'}</div></div>
        <button class="x" id="dClose" aria-label="Fechar">×</button></div>
      <div class="db">
        <div><div class="lbl">Resumo executivo</div>${blocoResumo(e, p, true)}</div>
        <div class="grid g3">
          <div class="card pad kpi"><div class="l">Nota média</div><div class="v num">${f1(p.score)}</div></div>
          <div class="card pad kpi"><div class="l">Início → recente</div><div class="v num" style="font-size:18px">${p.scoreIni == null ? '—' : f1(p.scoreIni) + ' → ' + f1(p.scoreRec)}</div></div>
          <div class="card pad kpi"><div class="l">Evolução</div><div class="v">${deltaBadge(p.deltaPct, '%') || '<span class="muted small">poucas sessões</span>'}</div></div>
        </div>
        <div>${spark(p.serie, 560, 60)}</div>
        <div><div class="lbl">Plano de desenvolvimento</div>
          ${p.prios.length ? p.prios.map((x, i) => `<div class="card pad" style="margin-bottom:10px">
            <div style="font-weight:700">${i + 1}. ${esc(skName(e, x.k))} <span class="muted small">· apareceu em ${x.taxa}% das sessões recentes</span></div>
            ${x.cenario ? `<div class="small" style="margin-top:4px"><span class="muted">Treinar em:</span> ${esc(x.cenario)}</div>` : ''}
            <div class="small" style="margin-top:6px">${esc(x.acao)}</div>
            ${x.exemplos && x.exemplos[0] ? `<div class="quote" style="margin-top:8px">“${esc(x.exemplos[0])}”</div>` : ''}
          </div>`).join('') : '<div class="muted small">Sem pontos de melhoria recorrentes nas sessões recentes.</div>'}
        </div>
        ${p.evoluiu.length ? `<div><div class="lbl">O que já evoluiu</div>${evoList(e, p.evoluiu)}</div>` : ''}
        <div><div class="lbl">Radar: ${esc(p.nome.split(' ')[0])} × empresa</div>
          <div class="radar-box">${radarSVG(e, [{ nome: 'Empresa toda', vals: domVals(e.geral), cor: COR_B, tracejado: true }, { nome: p.nome, vals: domVals(p), cor: COR_A, preench: true }], { size: 500, pad: 118 })}</div></div>
        <div><div class="lbl">Mapa individual (domínio por competência)</div>
          ${skills.map(({ s, d }) => {
            const c = heatBg(d.v);
            return `<div class="sbar ${d.v == null ? 'na' : ''}" data-tip="${esc(`${d.s} vez(es) ponto forte · ${d.g} vez(es) ponto de melhoria`)}">
              <span>${esc(s.emoji)} ${esc(s.nome)}</span>
              <span class="track">${c ? `<i style="width:${d.v}%;background:${c.bg}"></i>` : ''}</span>
              <span class="val num">${d.v == null ? '—' : d.v + '%'}</span></div>`;
          }).join('') || '<div class="muted small">Sem menções de competências nos feedbacks.</div>'}
          <div class="muted small" style="margin-top:6px">“—” = menos de 2 menções, evidência insuficiente.</div>
        </div>
      </div>`;
    $('drawer').classList.add('open'); $('drawerBg').classList.add('open');
    $('dClose').onclick = closeDrawer; $('dClose').focus();
  }
  function closeDrawer() { $('drawer').classList.remove('open'); $('drawerBg').classList.remove('open'); }
  $('drawerBg').onclick = closeDrawer;
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDrawer();
    const pt = e.target.closest && e.target.closest('.geo-pt');
    if (pt && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pt.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  });

  // ── Eventos ─────────────────────────────────────────────────────────────
  $('main').addEventListener('click', e => {
    const pr = e.target.closest('[data-person]'); if (pr) { if (geoMap) geoMap.closePopup(); openPerson(pr.dataset.person); return; }
    const gz = e.target.closest('[data-geo]'); if (gz) { const a = gz.dataset.geo; if (a === 'reset') { geoReset(); drawGeo(); } else geoZoom(a === 'in' ? 1.6 : 1 / 1.6); return; }
    const ft = e.target.closest('[data-ftoggle]'); if (ft) { state.fOpen = !state.fOpen; $('fbar').classList.toggle('open', state.fOpen); ft.setAttribute('aria-expanded', state.fOpen); return; }
    const fo = e.target.closest('[data-foco]'); if (fo) { const c = fo.dataset.foco; state.geoFoco = c && state.geoFoco !== c ? c : ''; if (state.geoFoco && fo.closest('.geo-side')) geoFocar(c); keepScroll(render); return; }
    const ct = e.target.closest('[data-city]'); if (ct) { toggleCidade(ct.dataset.city); return; }
    if (e.target.closest('[data-execall]')) { state.execAll = !state.execAll; keepScroll(render); return; }
    if (e.target.closest('[data-limpar]')) { state.f = { cidade: '', equipe: '', corretor: '', q: '' }; keepScroll(render); return; }
    const r = e.target.closest('[data-rows]'); if (r) { state.rows = r.dataset.rows; render(); return; }
    const m = e.target.closest('[data-metric]'); if (m) { state.metric = m.dataset.metric; render(); return; }
  });
  $('main').addEventListener('input', e => {
    if (e.target.id === 'fQ') {
      state.f.q = e.target.value;
      clearTimeout(window.__fq); window.__fq = setTimeout(() => {
        const pos = e.target.selectionStart; keepScroll(render);
        const inp = $('fQ'); if (inp) { inp.focus(); inp.setSelectionRange(pos, pos); }
      }, 250);
    }
  });
  $('main').addEventListener('change', e => {
    if (e.target.id === 'ordem') { state.ordem = e.target.value; $('people').innerHTML = peopleCards(EMP[state.tab]); }
    if (['fCidade', 'fEquipe', 'fCorretor'].includes(e.target.id)) {
      const campo = { fCidade: 'cidade', fEquipe: 'equipe', fCorretor: 'corretor' }[e.target.id];
      state.f[campo] = e.target.value;
      if (campo !== 'corretor' && state.f.corretor && !filtrar(EMP[state.tab]).length) state.f.corretor = '';
      keepScroll(render); return;
    }
    if (e.target.id === 'radarSel') { state.radar = e.target.value; $('radarWrap').innerHTML = radarEmpresa(EMP[state.tab]); }
  });
  const tip = $('tip');
  document.addEventListener('mousemove', e => {
    const t = e.target.closest('[data-tip]');
    if (!t) { tip.style.opacity = 0; return; }
    tip.textContent = t.getAttribute('data-tip');
    tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px';
    tip.style.top = Math.min(e.clientY + 16, innerHeight - tip.offsetHeight - 8) + 'px';
    tip.style.opacity = 1;
  });
  $('themeBtn').onclick = () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    if (EMP[state.tab] && !EMP[state.tab].vazio) initGeo(EMP[state.tab]);
  };

  // ── Guia de leitura ─────────────────────────────────────────────────────
  function renderGuia() {
    const ok = DATA.empresas.filter(e => !e.vazio);
    const ex = ok[0];
    const g = ex ? ex.geral : null;
    const p1 = g && g.prios[0];
    const evo1 = g && g.evoluiu.find(v => v.tipo === 'dominio');
    const pessoa = ex ? ex.pessoas.filter(p => p.n >= 4 && p.prios.length).sort((a, b) => b.n - a.n)[0] : null;
    const exBox = (html) => ex ? `<div class="g-ex"><span class="lbl" style="margin:0">Exemplo nos dados de hoje</span>${html}</div>` : '';
    const passo = (n, titulo, corpo) => `<div class="card pad g-step"><div class="g-n">${n}</div><div><h3>${titulo}</h3>${corpo}</div></div>`;
    return `
    <section class="block" style="margin-top:0">
      <div class="sec-h"><h2>Como ler e analisar este relatório</h2>
        <span class="hint">Um roteiro de 20 minutos para sair da leitura com decisões: o que treinar, com quem e como medir se funcionou.</span></div>

      <div class="card pad g-concepts">
        <div><div class="lbl">Nota média</div><p>A nota que a rhapsody deu a cada simulação (0 a 100), na média. Mede o <b>resultado</b> da conversa.</p></div>
        <div><div class="lbl">Domínio da competência</div><p>De todas as vezes que o feedback da rhapsody citou uma competência, quantas foram como <b>ponto forte</b>. 80% = quase sempre elogiada; 20% = quase sempre apontada como falha. Mede o <b>comportamento</b>.</p></div>
        <div><div class="lbl">Evolução</div><p>Compara a <b>1ª metade</b> das sessões (as mais antigas) com a <b>2ª metade</b> (as mais recentes). Na nota, em % (de 30 para 60 = +100%); no domínio, em pontos (de 30% para 60% = +30).</p></div>
        <div><div class="lbl">Linha de ataque</div><p>As competências que <b>mais aparecem como ponto de melhoria nas sessões recentes</b>. É o que está travando a operação hoje, não no passado.</p></div>
      </div>
    </section>

    <section class="block">
      <div class="sec-h"><h2>Roteiro de análise em 6 passos</h2></div>
      <div class="grid g-steps">
        ${passo(1, 'Comece pela direção: a operação está melhorando?', `<p>${UNICA ? 'No topo da aba da empresa, olhe o card <b>Evolução da nota</b>. Depois, no <b>Radar de competências</b>, deixe selecionado “início × recente”' : 'Na <b>Visão geral</b>, olhe a evolução da nota de cada empresa e o radar'} (tracejado = início, área azul = agora). Área azul maior que o tracejado = time evoluindo.</p>
          <p class="muted small">Confira também o gráfico “Nota média por mês” (só corretores, sem a liderança): a linha mostra a evolução mês a mês e o tracejado, a tendência. Uma queda pode vir de poucas sessões no mês (passe o mouse para ver quantas).</p>
          ${exBox(ok.map(e => `<p>${esc(e.nome)}: nota ${f1(e.geral.scoreIni)} → ${f1(e.geral.scoreRec)} (${e.geral.deltaPct > 0 ? '+' : ''}${f1(e.geral.deltaPct)}%).</p>`).join(''))}`)}
        ${passo(2, 'Escolha no máximo 3 prioridades: a linha de ataque', `<p>Na aba da empresa, a <b>Linha de ataque</b> já vem ordenada. Para cada item, leia:</p>
          <ul><li><b>% das sessões recentes</b>: acima de 30% é um problema do time, não de indivíduos.</li>
          <li><b>Tendência</b>: ▼ vermelho = está piorando, trate primeiro; ▲ verde = já está melhorando, mantenha.</li>
          <li><b>Treinar em</b>: o cenário onde essa falha mais aparece. É onde o treino rende mais.</li>
          <li><b>Citação</b>: um trecho real do feedback. Use em reunião para mostrar o problema concreto.</li></ul>
          ${p1 ? exBox(`<p>${esc(ex.nome)}: a prioridade 1 é <b>${esc(skName(ex, p1.k))}</b>, ponto de melhoria em ${p1.taxa}% das sessões recentes${p1.tend != null ? `, tendência ${p1.tend > 0 ? '+' : ''}${p1.tend} pontos` : ''}. Treinar em: ${esc(p1.cenario || '—')}.</p>`) : ''}`)}
        ${passo(3, 'Veja onde o problema mora: por área', `<p>Nos <b>cards de área</b> e no <b>Mapa de competências</b> (modo Áreas), compare as barras. Uma competência vermelha em uma área e azul em outra indica uma <b>boa prática que pode ser transferida</b> entre as equipes.</p>
          <p>No <b>radar</b>, escolha “Área × empresa”: onde a área azul fica dentro do tracejado, aquela área está abaixo da média da empresa.</p>`)}
        ${passo(4, 'Desça para as pessoas: quem precisa do quê', `<p>Em cada prioridade, <b>“Quem priorizar”</b> lista quem ainda erra naquilo nas sessões recentes. Clique no nome para abrir a análise individual: nota, evolução, radar contra a empresa e o <b>plano de desenvolvimento</b> dela.</p>
          <p>Na lista de Pessoas, ordene por <b>“Maior evolução”</b> para achar quem está respondendo ao treino (bons exemplos para o time) e quem está caindo (precisa de acompanhamento).</p>
          ${pessoa ? exBox(`<p>${esc(pessoa.nome)} (${pessoa.n} sessões): nota ${f1(pessoa.scoreIni)} → ${f1(pessoa.scoreRec)}${pessoa.deltaPct != null ? ` (${pessoa.deltaPct > 0 ? '+' : ''}${f1(pessoa.deltaPct)}%)` : ''}; prioridade: <b>${esc(skName(ex, pessoa.prios[0].k))}</b>.</p>`) : ''}`)}
        ${passo(5, 'Reconheça o que já evoluiu', `<p>O bloco <b>O que evoluiu</b> mostra competências cujo domínio subiu e pontos de melhoria que deixaram de aparecer. Use para dar retorno positivo ao time e ao cliente: mostra que o treino está funcionando.</p>
          <p>No Mapa de competências, o modo <b>Evolução</b> mostra, para cada área ou pessoa, onde estava (traço) e onde está agora (barra).</p>
          ${evo1 ? exBox(`<p>${esc(ex.nome)}: <b>${esc(skName(ex, evo1.k))}</b> foi de ${evo1.ini}% para ${evo1.rec}% de domínio (+${evo1.delta}).</p>`) : ''}`)}
        ${passo(6, 'Feche com um plano e uma data para medir', `<p>Para cada prioridade, defina: <b>cenário</b> a treinar, <b>quem</b> vai treinar, <b>quantas simulações</b> até a próxima leitura e a <b>meta</b> (por exemplo, cair de 40% para 25% das sessões com esse ponto de melhoria).</p>
          <p>Gere o relatório de novo depois de 2 a 4 semanas e compare: a prioridade caiu na linha de ataque? O domínio subiu? A nota acompanhou?</p>`)}
      </div>
    </section>

    <section class="block">
      <div class="grid">
        <div class="card pad"><div class="lbl">Sinais para ficar atento</div><ul class="g-list">
          <li><b>Nota subindo e competência caindo</b>: o time pode estar acertando o resultado da conversa sem o método. Vale olhar as citações.</li>
          <li><b>Competência com domínio alto e pouca evidência</b>: “100%” com 3 menções vale menos do que 70% com 40. Passe o mouse na barra para ver as contagens.</li>
          <li><b>Mesma falha em muitas pessoas</b>: é conteúdo ou cenário, não indivíduo. Treine o grupo.</li>
          <li><b>Falha concentrada em 1 ou 2 pessoas</b>: acompanhamento individual resolve mais rápido.</li>
          <li><b>Pessoa com 1 ou 2 sessões</b>: ainda não há padrão. Incentive mais simulações antes de concluir qualquer coisa.</li>
        </ul></div>
      </div>
    </section>

    <section class="block">
      <div class="card pad"><div class="lbl">Perguntas para levar à reunião com o cliente</div><ol class="g-list">
        <li>As 3 prioridades da linha de ataque batem com o que os gestores veem no dia a dia?</li>
        <li>Quais áreas ou pessoas podem servir de referência nas competências em que o time vai mal?</li>
        <li>Quais cenários vamos reforçar nas próximas semanas, e com qual meta de simulações por pessoa?</li>
        <li>O que evoluiu desde o início do piloto, e o que explica essa evolução?</li>
        <li>Quem está com poucas sessões e precisa ser reengajado para que a análise faça sentido?</li>
      </ol></div>
    </section>
    ${metodo()}`;
  }

  function metodo() {
    return `<details class="method"><summary>Como o mapa é calculado</summary><div>
      <p><b>Frequência de uso:</b> conta os <b>runs</b>, isto é, todas as simulações iniciadas na plataforma, avaliadas ou não. "Por semana" divide os runs pelas semanas do programa (do primeiro run da operação até o último), para comparar todos na mesma régua. Uso frequente = 2 ou mais runs por semana; moderado = de 1 a 2; baixo = menos de 1. Treinando = último run há até 7 dias; esfriando = 8 a 21 dias; parado = mais de 21 dias.</p>
      <p><b>Fonte:</b> sessões finalizadas, com nota e com debriefing escrito pela rhapsody, excluindo a equipe interna (rhapsody, testes). As regras de área, de exclusão e as listas de competências são as mesmas dos dashboards de cada cliente.</p>
      <p><b>Ponto forte × ponto de melhoria:</b> o debriefing de cada sessão é dividido nas seções “pontos fortes” e “pontos de melhoria”. Uma competência conta uma vez por sessão em cada lado quando alguma palavra-chave dela aparece no início de uma palavra daquela seção.</p>
      <p><b>Domínio</b> = sessões em que a competência foi ponto forte ÷ (sessões em que foi ponto forte + sessões em que foi ponto de melhoria). Só é exibido com pelo menos 3 menções (2 para pessoas).</p>
      <p><b>Evolução</b> compara a primeira e a segunda metade das sessões em ordem de data. Na <b>nota</b>, a evolução é percentual sobre a média inicial (de 30 para 60 = +100%); no <b>domínio das competências</b>, é em pontos (de 30% para 60% = +30). A <b>linha de ataque</b> ordena as competências pela frequência com que aparecem como ponto de melhoria na metade mais recente.</p>
    </div></details>`;
  }

  $('sub').textContent = `${DATA.empresas.map(e => e.nome).join(' · ')} — dados da plataforma até ${DATA.empresas[0].ultimoRun || DATA.empresas[0].periodo[1]} · gerado em ${DATA.gerado}`;
  if (UNICA) { document.title = `Mapa de Competências · ${DATA.empresas[0].nome}`; document.querySelector('.brand h1').textContent = 'Mapa de Competências'; }
  render();
})();
</script>
</body>
</html>
